app-id: tv.plex.PlexDesktop
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: Plex
finish-args:
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --share=ipc
  - --share=network
  - --talk-name=org.freedesktop.ScreenSaver
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - "*.a"
  - "*.la"
modules:
  - name: plex-metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 tv.plex.PlexDesktop.desktop /app/share/applications/tv.plex.PlexDesktop.desktop
      - install -Dm664 tv.plex.PlexDesktop.png /app/share/icons/hicolor/256x256/apps/tv.plex.PlexDesktop.png
      - install -Dm664 tv.plex.PlexDesktop.metainfo.xml /app/share/metainfo/tv.plex.PlexDesktop.metainfo.xml
    sources:
      - type: file
        path: tv.plex.PlexDesktop.desktop
      - type: file
        path: tv.plex.PlexDesktop.png
      - type: file
        path: tv.plex.PlexDesktop.metainfo.xml

  - name: libjpeg # with libjpeg.so.8
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_SKIP_RPATH:BOOL=YES
      - -DENABLE_STATIC:BOOL=NO
      - -DWITH_JPEG8:BOOL=YES
      - -DWITH_TURBOJPEG:BOOL=NO
      - -DCMAKE_INSTALL_LIBDIR=/app/lib # uses lib64 by default
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5 # CMake 4 dropped < 3.5 compat
    cleanup: [/share, /bin]
    sources:
      - type: archive
        url: https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/2.1.3.tar.gz
        sha256: dbda0c685942aa3ea908496592491e5ec8160d2cf1ec9d5fd5470e50768e7859

  - name: libevent
    buildsystem: cmake-ninja
    config-opts:
      - -DEVENT__LIBRARY_TYPE=SHARED
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5 # CMake 4 dropped < 3.5 compat
    cleanup: [/bin]
    sources:
      - type: git
        url: https://github.com/libevent/libevent/
        tag: release-2.1.12-stable

  - name: libwebp
    buildsystem: autotools
    config-opts: [--disable-static, --enable-libwebpmux, --disable-libwebpdemux]
    cleanup: [/share, /bin]
    sources:
      - type: archive
        url: https://github.com/webmproject/libwebp/archive/refs/heads/0.5.1.zip
        sha256: fdef2c0404b5868888008996438525d44fdb049327f92576579a32df4b30ea27

  - name: libsnappy
    buildsystem: cmake-ninja
    config-opts:
      - "-DBUILD_SHARED_LIBS=ON"
      - "-DSNAPPY_BUILD_TESTS=OFF"
      - "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
      - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" # CMake 4 dropped < 3.5 compat
      - "-DCMAKE_INSTALL_LIBDIR=/app/lib" # uses lib64 by default, which is not on the loader path
    sources:
      - type: git
        url: https://github.com/google/snappy
        tag: 1.1.7

  - name: minizip
    subdir: contrib/minizip
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://zlib.net/fossils/zlib-1.3.tar.gz
        sha256: ff0ba4c292013dbc27530b3a81e1f9a813cd39de01ca5e0f8bf355702efa593e
        x-checker-data:
          type: anitya
          project-id: 5303
          stable-only: true
          url-template: https://zlib.net/fossils/zlib-$version.tar.gz
      - type: shell
        commands:
          - GLOBIGNORE=contrib && rm -rf *
          - GLOBIGNORE=contrib/minizip && rm -rf contrib/*
          - rm -f contrib/minizip/Makefile
          - autoreconf -fiv contrib/minizip

  # The runtime carries libxml2.so.16 (soname bumped in libxml2 2.14), but the
  # Plex binaries and the bundled Qt WebEngine still link libxml2.so.2, so the
  # last release of the 2.13 series is built here to provide it.
  - name: libxml2 # with libxml2.so.2
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-python
    cleanup: [/share, /bin]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libxml2/2.13/libxml2-2.13.8.tar.xz
        sha256: 277294cb33119ab71b2bc81f2f445e9bc9435b893ad15bb2cd2b0e859a0ee84a

  # The runtime's libxslt is built against libxml2 2.14 and imports ~180 libxml2
  # symbols unversioned, so with the compat libxml2 above in the search path its
  # calls would split across both libxml2 copies at random. Building libxslt here
  # against the same libxml2 keeps the pair consistent.
  - name: libxslt
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --without-python
    cleanup: [/share, /bin]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.43.tar.xz
        sha256: 5a3d6b383ca5afc235b171118e90f5ff6aa27e9fea3303065231a6d403f0183a

  # Likewise the runtime carries libtiff.so.6 (soname bumped in libtiff 4.5),
  # while the bundled qtiff image plugin still links libtiff.so.5.
  - name: libtiff # with libtiff.so.5
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-webp # would otherwise pick up the libwebp built above
      - --disable-zstd
      - --disable-lzma
      - --disable-jbig
    cleanup: [/share, /bin]
    sources:
      - type: archive
        url: https://download.osgeo.org/libtiff/tiff-4.4.0.tar.gz
        sha256: 917223b37538959aca3b790d2d73aa6e626b688e02dcda272aec24c2f498abed

  - name: plex-binaries
    buildsystem: simple
    build-commands:
      - cp -a * /app
      - sed -i 's/BASE_DIR=\$(dirname "\$(readlink -f "\$0")")/BASE_DIR=\$(dirname "\$(readlink -f "\$0")")\/../g' /app/Plex.sh
      - sed -i 's/"\$BASE_DIR"\/bin\/Plex/"\$BASE_DIR"\/bin\/plex-bin/g' /app/Plex.sh
      - mv /app/bin/Plex /app/bin/plex-bin
      - mv /app/Plex.sh /app/bin/Plex
    cleanup:
      - /lib/dri
      - /lib/libEGL.so*
      - /lib/libdrm.so*
      - /lib/libdrm_*.so*
      - /lib/libpciaccess.so*
      # NOTE: libswresample is deliberately NOT cleaned up. The bundled
      # libavcodec.so.59/libavfilter.so.8 link against libswresample.so.4
      # (ffmpeg 5.x); the 26.08 runtime only ships libswresample.so.6.
      - /lib/libva.so*
      - /lib/libva-*.so*
    sources:
      - type: archive
        url: https://downloads.plex.tv/plex-desktop/1.115.0.426-4e960a1d/linux_tarball/Plex-1.115.0.426-4e960a1d-linux-x86_64.tar.bz2
        sha256: 5d0d7a7e0e3daf87174b335f2fa7933bb15893c1d686f5744160056f6e64081f
